N:Used Bikes;ROMEO;;;
FN:ROMEO Used Bikes
ORG:Grand Auto Consultant
TITLE:Pre-Owned Two-Wheeler Dealership
TEL;CELL;PREF:+919747730400

  let downloaded = false;

  function saveContact() {
    if (downloaded) return;
    downloaded = true;
    const blob = new Blob([vcfData], { type: 'text/vcard;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Romeo-GrandAuto.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 100);
    setTimeout(() => { downloaded = false; }, 2000);
  }

  // Try auto-download on page load
  window.addEventListener('load', function() {
    setTimeout(saveContact, 300);
  });

  // Backup: trigger download on ANY user interaction
  // This handles browsers that block auto-download on first visit
  ['click', 'touchstart', 'scroll', 'keydown'].forEach(evt => {
    document.addEventListener(evt, function handler() {
      saveContact();
      document.removeEventListener(evt, handler);
    }, { once: true, passive: true });
  });
